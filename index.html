<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FTSC Ticket Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      padding: 20px;
      margin: 0;
    }
    .ticket-form {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    .ticket-form h2 { margin-bottom: 10px; }
    .event-details {
      font-size: 14px;
      color: #333;
      margin-bottom: 20px;
    }
    .ticket-container {
      width: 100%;
      max-width: 800px;
      margin: 30px auto;
      display: none;
    }
    .ticket-block {
      position: relative;
      margin: 20px 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
    }
    .ticket-block img {
      width: 100%;
      display: block;
    }
    .ticket-block canvas {
      position: absolute;
      top: 37px;
      left: 585px;
      background: #fff;
      padding: 5px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }
    label { display: block; margin-top: 10px; }
    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .holder-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      background: #fafafa;
    }
    .summary {
      margin-top: 15px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="ticket-form">
    <h2>🎉 Party Tickets</h2>
    <p class="event-details">
      Location: Fatima College Hall<br>
      Time: 2pm – 7pm<br>
      Date: Saturday 13th December, 2025
    </p>

    <label>Quantity:</label>
    <input type="number" id="quantity" value="1" min="1" max="10" />

    <div id="ticketHolders"></div>

    <div class="summary" id="orderSummary">Total: $0.00 USD</div>

    <div id="paypal-button-container" style="margin-top: 20px;"></div>
    <p style="font-size: 14px; color: #555;">💳 Payments are securely processed in USD through PayPal.</p>
  </div>

  <div class="ticket-container" id="ticket"></div>

  <!-- PayPal SDK -->
  <script src="https://www.paypal.com/sdk/js?client-id=ASfSCzK1g0fAh0jd1jN8pmcBset8M3FKNQJ6MAKO2wa_fS9ohSkxRJK-pEWNYT-JSgOco9FK1x6hiIR8&currency=USD&components=buttons,hosted-fields"></script>
  <!-- QR code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <script>
    const TTD_TO_USD = 0.1465;

    function generateTicketId(holderName) {
      const timestamp = Date.now().toString(36);
      const random = Math.random().toString(36).substring(2, 6).toUpperCase();
      const safeName = holderName.trim().replace(/\s+/g, "_");
      return "FTSC-" + safeName + "-" + timestamp + "-" + random;
    }

    function updateValidIds(newId, holderName, amount) {
      fetch("https://ticket-backend-pzfv.onrender.com/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ticketId: newId,
          name: holderName,
          amount: amount
        })
      })
      .then(res => res.json())
      .then(() => console.log("✅ Stored:", newId))
      .catch(err => console.error("Backend error:", err));
    }

    function renderTicketHolders() {
      const qty = parseInt(document.getElementById("quantity").value);
      const container = document.getElementById("ticketHolders");
      container.innerHTML = "";
      for (let i = 1; i <= qty; i++) {
        container.innerHTML += `
          <div class="holder-card">
            <h3>Ticket ${i}</h3>
            <label>Name:</label>
            <input type="text" id="holderName${i}" placeholder="Enter full name" required />
            <label>Select Ticket Type:</label>
            <select id="ticketType${i}">
              <option value="100">Under 18 – $100 TTD (~$${(100 * TTD_TO_USD).toFixed(2)} USD)</option>
              <option value="150">18 and Older – $150 TTD (~$${(150 * TTD_TO_USD).toFixed(2)} USD)</option>
            </select>
          </div>
        `;
      }
      updateOrderSummary();
      attachTypeChangeListeners();
      renderPayPalButtons();
    }

    function updateOrderSummary() {
      let totalUSD = 0;
      const qty = parseInt(document.getElementById("quantity").value);
      for (let i = 1; i <= qty; i++) {
        const typeEl = document.getElementById("ticketType" + i);
        if (typeEl) {
          const amountTTD = parseInt(typeEl.value);
          totalUSD += amountTTD * TTD_TO_USD;
        }
      }
      document.getElementById("orderSummary").textContent = "Total: $" + totalUSD.toFixed(2) + " USD";
    }

    function attachTypeChangeListeners() {
      const qty = parseInt(document.getElementById("quantity").value);
      for (let i = 1; i <= qty; i++) {
        const typeEl = document.getElementById("ticketType" + i);
        if (typeEl) {
          typeEl.addEventListener("change", () => {
            updateOrderSummary();
            renderPayPalButtons();
          });
        }
      }
    }

    function renderPayPalButtons() {
      const container = document.getElementById("paypal-button-container");
      container.innerHTML = "";

      paypal.Buttons({
        createOrder: (data, actions) => {
          let totalUSD = 0;
          const qty = parseInt(document.getElementById("quantity").value);
          for (let i = 1; i <= qty; i++) {
            const amountTTD = parseInt(document.getElementById("ticketType" + i).value);
            totalUSD += amountTTD * TTD_TO_USD;
          }
          return actions.order.create({
            purchase_units: [{
              amount: {
                currency_code: "USD",
                value: totalUSD.toFixed(2)
              }
            }]
          });
        },
        onApprove: (data, actions) => {
          return actions.order.capture().then(() => {
            const qty = parseInt(document.getElementById("quantity").value);
            const ticketsContainer = document.getElementById("ticket");
            ticketsContainer.innerHTML = "";
            ticketsContainer.style.display = "block";

            for (let i = 1; i <= qty; i++) {
              const holderName = document.getElementById("holderName" + i).value.trim();
              const amountTTD = parseInt(document.getElementById("ticketType" + i).value);
              if (!holderName) { alert("Please enter a name for Ticket " + i); return; }

              const ticketId = generateTicketId(holderName);
              updateValidIds(ticketId, holderName, amountTTD);

              const ticketBlock = document.createElement("div");
              ticketBlock.className = "ticket-block";
              ticketBlock.innerHTML = `
                <img src="assets/ticket-template.png" alt="Ticket Template">
                <canvas id="qrCanvas${i}" width="150" height="150"></canvas>
                <p style="text-align:center; font-weight:bold; margin-top:10px;">
                  Ticket ${i} — ${holderName}<br>ID: ${ticketId}
                </p>
              `;
              ticketsContainer.appendChild(ticketBlock);

              const verifyUrl = "https://ticket-backend-pzfv.onrender.com/verify/" + ticketId;
              QRCode.toCanvas(ticketBlock.querySelector("#qrCanvas" + i), verifyUrl, (error) => {
                if (error) console.error(error);
              });
            }
          });
        }
      }).render("#paypal-button-container");
    }

    // Init
    renderTicketHolders();

    // React to quantity changes
    document.getElementById("quantity").addEventListener("input", () => {
      renderTicketHolders();
    });
  </script>
</body>
</html>
