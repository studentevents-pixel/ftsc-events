<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FTSC Ticket Checkout</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }
    .ticket-form {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    .ticket-container {
      position: relative;
      width: 800px; /* match your ticket image width */
      margin: 30px auto;
      display: none;
    }
    .ticket-template {
      width: 100%;
      display: block;
    }
    #qrCanvas {
      position: absolute;
      top: 35px;    /* moved further up */
      left:575px;  /* moved further right */
      background: #fff;
      padding: 5px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2); /* optional for clarity */
    }
    #ticketId {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="ticket-form">
    <h2>🎉 Buy Your Party Ticket</h2>
    <label>Age Group:</label>
    <select id="ageGroup">
      <option value="14.65">Under 18 – $100 TTD (~$14.65 USD)</option>
      <option value="21.98">18 and Older – $150 TTD (~$21.98 USD)</option>
    </select>
    <label>Quantity:</label>
    <input type="number" id="quantity" value="1" min="1" max="10" />
    <div id="paypal-button-container" style="margin-top: 20px;"></div>
    <p style="font-size: 14px; color: #555;">💳 Payments are securely processed in USD through PayPal.</p>

    <!-- Test button for dev mode -->
    <button onclick="generateTestTicket()">🧪 Generate Test Ticket (No Payment)</button>
  </div>

  <div class="ticket-container" id="ticket">
    <!-- Ticket background -->
    <img src="assets/ticket-template.png" alt="Ticket Template" class="ticket-template">
    <!-- QR code overlay -->
    <canvas id="qrCanvas" width="150" height="150"></canvas>
  </div>

  <p id="ticketId"></p>
  <button onclick="downloadTicket()" style="display:none;" id="downloadBtn">Download Ticket</button>

  <!-- PayPal SDK -->
  <script src="https://www.paypal.com/sdk/js?client-id=ASfSCzK1g0fAh0jd1jN8pmcBset8M3FKNQJ6MAKO2wa_fS9ohSkxRJK-pEWNYT-JSgOco9FK1x6hiIR8&currency=USD"></script>
  <!-- QR code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <!-- html2canvas for screenshotting -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    function generateTicketId() {
      const timestamp = Date.now().toString(36);
      const random = Math.random().toString(36).substring(2, 8).toUpperCase();
      return "FTSC-" + timestamp + "-" + random;
    }

    function updateValidIds(newId) {
      const filePath = "verify/valid-ids.json";

      fetch(filePath)
        .then(res => res.json())
        .then(data => {
          if (!data.includes(newId)) {
            data.push(newId);
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "valid-ids.json";
            a.click();
            URL.revokeObjectURL(url);
            alert("✅ Updated valid-ids.json downloaded. Replace the one in your repo and push it.");
          }
        })
        .catch(error => {
          console.error("Could not fetch existing valid-ids.json:", error);
          const blob = new Blob([JSON.stringify([newId], null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "valid-ids.json";
          a.click();
          URL.revokeObjectURL(url);
          alert("⚠️ No existing file found. Created a new valid-ids.json.");
        });
    }

    function generateTestTicket() {
      const ticketId = generateTicketId();
      const verifyUrl = "https://studentevents-pixel.github.io/ftsc-events/verify/?id=" + ticketId;

      document.getElementById("ticketId").textContent = "Ticket ID: " + ticketId;
      document.getElementById("ticket").style.display = "block";
      document.getElementById("downloadBtn").style.display = "inline-block";

      QRCode.toCanvas(document.getElementById("qrCanvas"), verifyUrl, function (error) {
        if (error) console.error(error);
      });

      updateValidIds(ticketId);
    }

    function downloadTicket() {
      const ticket = document.querySelector(".ticket-container");
      html2canvas(ticket).then(canvas => {
        const link = document.createElement("a");
        link.download = "FTSC_Ticket.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    // PayPal integration
    paypal.Buttons({
      createOrder: (data, actions) => {
        const unitPriceUSD = parseFloat(document.getElementById("ageGroup").value);
        const qty = parseInt(document.getElementById("quantity").value);
        return actions.order.create({
          purchase_units: [{
            amount: {
              currency_code: "USD",
              value: (unitPriceUSD * qty).toFixed(2)
            }
          }]
        });
      },
      onApprove: (data, actions) => {
        return actions.order.capture().then(details => {
          generateTestTicket(); // reuse same flow after payment
        });
      }
    }).render("#paypal-button-container");
  </script>
</body>
</html>
