<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FTSC Events Ticket Checkout</title>
  <style>
    body {
      background: #f4f4f4;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px;
    }

    .ticket-form {
      max-width: 450px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    .ticket-form h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .ticket-form label {
      margin-top: 15px;
      font-weight: bold;
      display: block;
    }

    .ticket-form select,
    .ticket-form input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .note {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ticket-form">
    <h2>🎉 Buy Your Party Ticket</h2>

    <label for="ageGroup">Select Age Group:</label>
    <select id="ageGroup">
      <option value="14.65">Under 18 – $100 TTD (~$14.65 USD)</option>
      <option value="21.98">18 and Older – $150 TTD (~$21.98 USD)</option>
    </select>

    <label for="quantity">Number of Tickets:</label>
    <input type="number" id="quantity" value="1" min="1" max="10"/>

    <div id="paypal-button-container" style="margin-top: 20px;"></div>

    <p class="note">💳 Payments are securely processed in USD through PayPal.</p>
  </div>

  <script src="https://www.paypal.com/sdk/js?client-id=ASfSCzK1g0fAh0jd1jN8pmcBset8M3FKNQJ6MAKO2wa_fS9ohSkxRJK-pEWNYT-JSgOco9FK1x6hiIR8&currency=USD"></script>
  <script>
    paypal.Buttons({
      createOrder: (data, actions) => {
        const unitPriceUSD = parseFloat(document.getElementById("ageGroup").value);
        const qty = parseInt(document.getElementById("quantity").value);
        return actions.order.create({
          purchase_units: [{
            amount: {
              currency_code: "USD",
              value: (unitPriceUSD * qty).toFixed(2)
            }
          }]
        });
      },
      onApprove: (data, actions) => {
        return actions.order.capture().then(details => {
          alert("Payment successful! Thank you, " + details.payer.name.given_name);
        });
      }
    }).render("#paypal-button-container");
  </script>
</body>
</html>
