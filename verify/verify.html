<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ticket Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 50px;
    }
    #result {
      font-size: 4em;
      font-weight: bold;
      margin-top: 50px;
    }
    .valid {
      color: green;
    }
    .invalid {
      color: red;
    }
    input {
      font-size: 1.2em;
      padding: 10px;
      width: 300px;
    }
    button {
      font-size: 1.2em;
      padding: 10px 20px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Ticket Verification</h1>
  <p>Enter or scan a ticket ID:</p>
  <input type="text" id="ticketId" placeholder="Ticket ID">
  <button onclick="verifyTicket()">Verify</button>

  <div id="result"></div>

  <script>
    async function verifyTicket() {
      const ticketId = document.getElementById("ticketId").value.trim();
      if (!ticketId) {
        document.getElementById("result").textContent = "Please enter a ticket ID";
        document.getElementById("result").className = "";
        return;
      }

      try {
        const response = await fetch(`https://ticket-backend-pzfv.onrender.com/verify/${ticketId}`);
        const data = await response.json();

        const resultDiv = document.getElementById("result");
        if (data.valid) {
          resultDiv.textContent = "VALID ✅";
          resultDiv.className = "valid";
        } else {
          resultDiv.textContent = "INVALID ❌";
          resultDiv.className = "invalid";
        }
      } catch (err) {
        document.getElementById("result").textContent = "Error contacting server";
        document.getElementById("result").className = "invalid";
      }
    }
  </script>
</body>
</html>
