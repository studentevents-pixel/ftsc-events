<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ticket Verification</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #reader {
      width: 300px;
      margin: 0 auto;
    }
    #result {
      font-size: 3em;
      font-weight: bold;
      margin-top: 30px;
    }
    .valid {
      color: green;
    }
    .invalid {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Scan Ticket QR Code</h1>
  <div id="reader"></div>
  <div id="result">Waiting for scan...</div>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      fetch(`https://ticket-backend-pzfv.onrender.com/verify/${decodedText}`)
        .then(res => res.json())
        .then(data => {
          const resultDiv = document.getElementById("result");
          if (data.valid) {
            resultDiv.textContent = "VALID ✅";
            resultDiv.className = "valid";
          } else {
            resultDiv.textContent = "INVALID ❌";
            resultDiv.className = "invalid";
          }
        })
        .catch(() => {
          const resultDiv = document.getElementById("result");
          resultDiv.textContent = "Error contacting server";
          resultDiv.className = "invalid";
        });
    }

    Html5Qrcode.getCameras().then(cameras => {
      if (cameras && cameras.length) {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          onScanSuccess
        );
      } else {
        document.getElementById("result").textContent = "No camera found";
      }
    }).catch(err => {
      document.getElementById("result").textContent = "Camera access denied";
    });
  </script>
</body>
</html>
