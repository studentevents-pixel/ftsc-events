<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ticket Verification</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 10px;
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 10px;
    }
    #reader {
      width: 90vw;
      max-width: 500px;
      margin: 0 auto;
    }
    #result {
      font-size: 1.4em;
      font-weight: bold;
      margin-top: 30px;
      word-wrap: break-word;
    }
    .valid { color: green; }
    .invalid { color: red; }
  </style>
</head>
<body>
  <h1>Scan Ticket QR Code</h1>
  <div id="reader"></div>
  <div id="result">Waiting for scan...</div>

  <script>
    function onScanSuccess(decodedText) {
      console.log("Scanned QR text:", decodedText);

      // ✅ Normalize: if QR contains full verify URL, extract only the ticketId
      let ticketId = decodedText;
      if (ticketId.includes("/verify/")) {
        ticketId = ticketId.split("/verify/").pop();
      }

      fetch(`https://ticket-backend-pzfv.onrender.com/verify/${encodeURIComponent(ticketId)}`)
        .then(res => {
          if (!res.ok) throw new Error("Network response was not ok");
          return res.json();
        })
        .then(data => {
          console.log("Server response:", data);
          const resultDiv = document.getElementById("result");

          if (data.valid) {
            resultDiv.innerHTML = `
              <span class="valid">VALID ✅</span><br>
              Name: ${data.name}<br>
              Age Category: ${data.ageCategory}<br>
              Event Date: ${data.date}
            `;
          } else {
            resultDiv.textContent = "INVALID ❌";
            resultDiv.className = "invalid";
          }
        })
        .catch(err => {
          console.error("Fetch error:", err);
          const resultDiv = document.getElementById("result");
          resultDiv.textContent = "Error contacting server";
          resultDiv.className = "invalid";
        });
    }

    Html5Qrcode.getCameras().then(cameras => {
      if (cameras && cameras.length) {
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess
        );
      } else {
        document.getElementById("result").textContent = "No camera found";
      }
    }).catch(err => {
      console.error("Camera error:", err);
      document.getElementById("result").textContent = "Camera access denied";
    });
  </script>
</body>
</html>
